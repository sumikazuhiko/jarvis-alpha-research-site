[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/form"
  to = "https://sumikazuhiko.github.io/jarvis-alpha-research-site/intake.html"
  status = 302
