<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MT5 EA AI診断 - 申込フォーム代替</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#08111f;color:#e5edf8;margin:0;line-height:1.7;}
    main{max-width:860px;margin:0 auto;padding:36px 20px;}
    h1{font-size:30px;margin:0 0 8px;} h2{margin-top:28px;color:#93c5fd;}
    .box{background:#111b31;border:1px solid #26364f;border-radius:16px;padding:18px;margin:16px 0;}
    label{display:block;font-weight:700;margin-top:12px;} input,textarea,select{width:100%;box-sizing:border-box;margin-top:6px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#e5e7eb;padding:10px;font-size:15px;}
    textarea{min-height:110px;} button,.button{display:inline-block;background:#22c55e;color:#03120a;border:0;border-radius:12px;padding:12px 16px;font-weight:800;text-decoration:none;margin-top:14px;cursor:pointer;}
    .warn{background:#33230a;border:1px solid #f59e0b;color:#fde68a;border-radius:12px;padding:12px;}
    .small{font-size:13px;color:#a8b3c7;}
  </style>
</head>
<body>
<main>
  <h1>MT5 EA AI診断 - 無料ミニ診断</h1>
  <p>Google Form公開前でも使える、メール/DM送信用の代替申込ページです。入力後に「申込文をコピー」して、X DM・メール・noteメッセージで送ってください。</p>
  <div class="warn">利益保証・投資助言・売買指示ではありません。個人情報、口座番号、残高は削除して送ってください。EAファイルは初回不要です。</div>

  <section class="box">
    <label>お名前またはハンドルネーム<input id="name" placeholder="例: EA運用者A"></label>
    <label>返信先<input id="contact" placeholder="メール / X / note など"></label>
    <label>使用プラットフォーム<select id="platform"><option>MT5</option><option>MT4</option><option>MT4/MT5両方</option><option>その他</option></select></label>
    <label>現在のEA運用数<select id="eaCount"><option>1個</option><option>2〜5個</option><option>6〜10個</option><option>11個以上</option><option>まだ運用前</option></select></label>
    <label>主な運用対象<input id="symbols" placeholder="例: USDJPY, XAUUSD, BTCUSD"></label>
    <label>一番困っていること<textarea id="pain" placeholder="例: バックテストは良いのにリアルで負ける / DDが大きい / どのEAを止めるべきか分からない"></textarea></label>
    <label>共有可能なデータ<textarea id="data" placeholder="例: MT5取引履歴、バックテスト、Magic別損益、通貨ペア別損益"></textarea></label>
    <label>希望する返答<select id="pref"><option>無料で改善余地3点だけ知りたい</option><option>初回診断 50,000円も検討したい</option><option>詳細診断/改善実装も相談したい</option><option>まず15分だけ話したい</option></select></label>
    <label><input type="checkbox" id="agree" style="width:auto"> 本診断が利益保証・投資助言・売買指示ではないことに同意します</label>
    <button onclick="build()">申込文をコピー</button>
  </section>

  <section class="box">
    <h2>コピーされる申込文</h2>
    <textarea id="out" readonly></textarea>
    <p class="small">送信先が未定の場合は、この内容を保存して後でメール/DMに貼り付けてください。</p>
  </section>
</main>
<script>
function val(id){return document.getElementById(id).value.trim();}
function build(){
  if(!document.getElementById('agree').checked){alert('免責への同意が必要です');return;}
  const text = `MT5 EA AI診断 - 無料ミニ診断申込\n\nお名前: ${val('name')}\n返信先: ${val('contact')}\n使用プラットフォーム: ${val('platform')}\nEA運用数: ${val('eaCount')}\n主な運用対象: ${val('symbols')}\n\n一番困っていること:\n${val('pain')}\n\n共有可能なデータ:\n${val('data')}\n\n希望する返答: ${val('pref')}\n\n免責同意: 利益保証・投資助言・売買指示ではないことに同意します`;
  document.getElementById('out').value = text;
  navigator.clipboard.writeText(text).then(()=>alert('申込文をコピーしました'));
}
</script>
</body>
</html>
